# Fly.io deployment for the chat API. The web app is static — host it on
# Cloudflare Pages and point ALLOWED_ORIGIN + OPENROUTER_SITE_URL at it.
#
# First-time setup:
#   1. fly apps create <unique-app-name>          (then set `app` below)
#   2. fly volumes create portfolio_data --size 1 (SQLite lives on this volume)
#   3. fly secrets set OPENROUTER_API_KEY=... API_KEY=... \
#        CONTACT_EMAIL=... CONTACT_LINKEDIN=... CONTACT_GITHUB=...
#   4. fly deploy
# Never put secrets in this file.
app = "matheus-portfolio-api"
primary_region = "gru"

[build]

[env]
  PORT = "3001"
  # Cloudflare -> Fly proxy -> app is two trusted hops, so req.ip resolves to
  # the real client IP for the rate limiter and budget ledger. Reduce to 1 if
  # the API is hit directly without Cloudflare.
  TRUST_PROXY = "2"
  SESSION_DB_PATH = "/data/sessions.db"

[http_service]
  internal_port = 3001
  force_https = true
  # Suspend when idle (SSE turns run inside a machine that is kept alive for
  # their duration); cold starts are a few seconds on this stack.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"

[mounts]
  source = "portfolio_data"
  destination = "/data"
  initial_size = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
