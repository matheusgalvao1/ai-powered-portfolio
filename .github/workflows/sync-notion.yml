# Refresh Notion-backed context on the currently released API without deploying
# the client or picking up unreleased code from main.
name: Refresh production knowledge

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the new knowledge to Fly if it changed
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the last successful API deployment
        id: production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PRODUCTION_API_TAG: ${{ vars.PRODUCTION_API_TAG }}
        run: |
          deployments="$(gh api \
            "repos/$REPOSITORY/deployments?environment=production-api&per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[].id')"
          api_tag=""
          knowledge_sha=""
          for deployment_id in $deployments; do
            state="$(gh api \
              "repos/$REPOSITORY/deployments/$deployment_id/statuses?per_page=1" \
              --jq '.[0].state // empty')"
            if [ "$state" = "success" ]; then
              deployment="$(gh api "repos/$REPOSITORY/deployments/$deployment_id")"
              api_tag="$(jq -r '.ref' <<< "$deployment")"
              payload="$(jq -r '.payload // ""' <<< "$deployment")"
              if [ -n "$payload" ]; then
                knowledge_sha="$(jq -r 'try (fromjson | .knowledge_sha // "") catch ""' <<< "$payload")"
              fi
              break
            fi
          done

          # Bootstrap from the currently released version until this workflow
          # has recorded its first successful API deployment.
          if [ -z "$api_tag" ]; then
            api_tag="$PRODUCTION_API_TAG"
          fi
          if [ -z "$api_tag" ]; then
            echo "No successful production API deployment or bootstrap tag was found."
            exit 1
          fi
          gh release view "$api_tag" --json tagName --jq '.tagName' >/dev/null
          echo "api_tag=$api_tag" >> "$GITHUB_OUTPUT"
          echo "knowledge_sha=$knowledge_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the currently released API
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.production.outputs.api_tag }}
          fetch-depth: 0

      - name: Verify the production API tag is on main
        env:
          PRODUCTION_API_TAG: ${{ steps.production.outputs.api_tag }}
        run: |
          git fetch origin main --no-tags
          api_commit="$(git rev-parse "${PRODUCTION_API_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$api_commit" FETCH_HEAD; then
            echo "PRODUCTION_API_TAG must point to a release on main."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Notion and compare knowledge digest
        id: sync
        run: |
          pnpm sync:notion
          test -s knowledge/knowledge-base.md
          digest="$(sha256sum knowledge/knowledge-base.md | cut -d ' ' -f 1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          if [ "$digest" = "$LAST_DEPLOYED_KNOWLEDGE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
          LAST_DEPLOYED_KNOWLEDGE_SHA: ${{ steps.production.outputs.knowledge_sha }}

      - name: Validate API image build (manual dry run only)
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy
        run: docker build --tag portfolio-api-knowledge:dry-run .

      - name: Report manual dry-run completion
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy
        run: echo "Validation completed. No production deployment was performed."

      - name: Set up Fly CLI
        if: steps.sync.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy knowledge to the released API
        if: steps.sync.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        run: flyctl deploy --local-only --app matheus-portfolio-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Wait for API health
        if: steps.sync.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        run: >-
          curl --fail --silent --show-error --retry 12 --retry-all-errors
          --retry-delay 5 --max-time 15
          https://api.matheusgalvao.com/health

      - name: Verify direct Fly admin access is denied
        if: steps.sync.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            https://matheus-portfolio-api.fly.dev/admin/overview)"
          if [ "$status" != "401" ]; then
            echo "Expected direct Fly admin request to return 401; got $status."
            exit 1
          fi

      - name: Record successful knowledge deployment
        if: steps.sync.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          API_TAG: ${{ steps.production.outputs.api_tag }}
          KNOWLEDGE_SHA: ${{ steps.sync.outputs.sha256 }}
        run: |
          payload="$(jq -cn --arg knowledge_sha "$KNOWLEDGE_SHA" '{knowledge_sha:$knowledge_sha}')"
          deployment_body="$(jq -cn \
            --arg ref "$API_TAG" \
            --arg payload "$payload" \
            '{ref:$ref, environment:"production-api", description:"Notion knowledge refresh", auto_merge:false, required_contexts:[], payload:$payload, production_environment:true, transient_environment:false}')"
          deployment_id="$(printf '%s' "$deployment_body" | gh api \
            "repos/$REPOSITORY/deployments" --method POST --input - --jq '.id')"
          gh api "repos/$REPOSITORY/deployments/$deployment_id/statuses" \
            --method POST \
            -f state=success \
            -f environment_url=https://api.matheusgalvao.com/health \
            -f description="Notion knowledge deployed to API $API_TAG" \
            --jq '.state'

      - name: Report unchanged knowledge
        if: steps.sync.outputs.changed != 'true'
        run: echo "Notion content matches the last deployed knowledge; Fly was not redeployed."

      - name: Report changed knowledge not deployed
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy && steps.sync.outputs.changed == 'true'
        run: echo "Notion content changed. Re-run with deploy enabled to publish it to Fly."
