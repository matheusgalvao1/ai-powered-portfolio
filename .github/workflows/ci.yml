# Continuous verification for every push to main and every PR.
#
# This repo has no linter configured. Run tests, typecheck, and build for PRs
# and main pushes; production deploys are handled by production-release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test API and web
        run: |
          pnpm --filter @portfolio/api test
          pnpm --filter @portfolio/web test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/portfolio_test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
