# Continuous verification for every push to main and every PR.
#
# This repo has no linter configured. Run tests, typecheck, and build for PRs
# and main pushes; production deploys are handled by production-release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test API and web
        run: |
          pnpm --filter @portfolio/api test
          pnpm --filter @portfolio/web test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
