name: Production release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.matheusgalvao.com' }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'release'
        run: |
          git fetch origin main --no-tags
          release_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_commit" FETCH_HEAD; then
            echo "The release tag must point to a commit on main."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test API and web
        run: |
          pnpm --filter @portfolio/api test
          pnpm --filter @portfolio/web test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web client
        run: pnpm build

      - name: Generate private knowledge base from Notion
        id: sync-knowledge
        run: |
          pnpm sync:notion
          digest="$(sha256sum knowledge/knowledge-base.md | cut -d ' ' -f 1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}

      - name: Validate generated knowledge base
        run: test -s knowledge/knowledge-base.md

      - name: Validate API image build (manual dry run only)
        if: github.event_name == 'workflow_dispatch'
        run: docker build --tag portfolio-api-release:dry-run .

      - name: Verify Wrangler setup (manual dry run only)
        if: github.event_name == 'workflow_dispatch'
        run: npm exec --yes --package=wrangler@4.149.0 -- wrangler --version

      - name: Report dry-run completion
        if: github.event_name == 'workflow_dispatch'
        run: echo "Validation completed. No production deployment was performed."

      - name: Set up Fly CLI
        if: github.event_name == 'release' && !github.event.release.prerelease
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Apply Postgres schema migrations
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: pnpm --filter @portfolio/api db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}

      - name: Deploy API to Fly
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: flyctl deploy --local-only --app matheus-portfolio-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Wait for API health
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: >-
          curl --fail --silent --show-error --retry 12 --retry-all-errors
          --retry-delay 5 --max-time 15
          https://api.matheusgalvao.com/health

      - name: Verify direct Fly admin access is denied
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            https://matheus-portfolio-api.fly.dev/admin/overview)"
          if [ "$status" != "401" ]; then
            echo "Expected direct Fly admin request to return 401; got $status."
            exit 1
          fi

      - name: Record successful API deployment for knowledge refresh
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          KNOWLEDGE_SHA: ${{ steps.sync-knowledge.outputs.sha256 }}
        run: |
          payload="$(jq -cn --arg knowledge_sha "$KNOWLEDGE_SHA" '{knowledge_sha:$knowledge_sha}')"
          deployment_body="$(jq -cn \
            --arg ref "$RELEASE_TAG" \
            --arg payload "$payload" \
            '{ref:$ref, environment:"production-api", description:"Fly API release", auto_merge:false, required_contexts:[], payload:$payload, production_environment:true, transient_environment:false}')"
          deployment_id="$(printf '%s' "$deployment_body" | gh api \
            "repos/$REPOSITORY/deployments" --method POST --input - --jq '.id')"
          gh api "repos/$REPOSITORY/deployments/$deployment_id/statuses" \
            --method POST \
            -f state=success \
            -f environment_url=https://api.matheusgalvao.com/health \
            -f description="Fly API $RELEASE_TAG passed health and Access checks" \
            --jq '.state'

      - name: Deploy web client to Cloudflare Pages
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: >-
          npm exec --yes --package=wrangler@4.149.0 -- wrangler pages deploy
          apps/web/dist --project-name=ai-powered-portfolio --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
